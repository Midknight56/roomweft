<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F6F1E7">
    <meta name="description" content="Keep the furniture you own. Find pieces that fit your small room and your budget.">
    <title>RoomWeft · A little room, well woven</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip" href="#panel">Skip to room controls</a>
    <header class="topbar"><a class="logo" href="/" aria-label="RoomWeft home"><svg viewBox="0 0 40 32" aria-hidden="true"><path d="M2 6h36M2 16h36M2 26h36M10 0v32M20 0v32M30 0v32"/></svg>RoomWeft</a><div id="status" class="status" aria-label="Service status"></div><span id="mode-label" data-testid="mode-label">Loading your room</span></header>
    <main id="app" class="layout">
      <div class="view-column"><div id="room" class="room"><nav class="view-modes" aria-label="Room camera"><button type="button" data-mode="Overview" data-testid="mode-overview" aria-label="Overview view" aria-pressed="true">Overview</button><button type="button" data-mode="Plan" data-testid="mode-plan" aria-label="Plan view" aria-pressed="false">Plan</button><button type="button" data-mode="Walk" data-testid="mode-walk" aria-label="Walk view" aria-pressed="false">Walk</button><button type="button" id="rotate" hidden title="Rotate the selected item in Plan">Rotate ↻</button></nav><div id="object-label" class="object-label" role="status" hidden></div></div><p class="room-caption">Your desk stays. RoomWeft fits the rest.<small id="room-finding" class="alarm" hidden></small></p><p id="view-hint" class="view-hint">Your room, woven around what you own. Drag to orbit.</p><div class="room-key"><span class="moss">● Fits</span><span class="amber">● Fit unverified</span><span class="alarm">● Needs room</span><span id="room-dimensions" data-testid="room-dimensions">380 x 320 cm</span></div></div>
      <aside id="panel" class="panel" aria-label="Design your room"></aside>
    </main>
    <nav id="phone-jump" class="phone-jump" aria-label="Jump to picks"><a href="#picks" class="phone-jump-link">Picks and basket</a></nav>
    <noscript><p>RoomWeft needs JavaScript to show your room and check the fit.</p></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
